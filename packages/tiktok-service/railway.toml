[build]
builder = "nixpacks"
buildCommand = "cd ../.. && npm install && npm run build --workspace=packages/tiktok-service"

[deploy]
startCommand = "node packages/tiktok-service/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
